<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>WEBPOS 實體鍵盤對照卡（A5）</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; color: #000; background: #fff; font-size: 22px; padding: 16px; max-width: 560px; }
  h1 { font-size: 30px; border-bottom: 4px solid #000; padding-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 24px; }
  td, th { border: 2px solid #000; padding: 8px 12px; text-align: left; }
  @media print { button { display: none; } }
</style>
</head>
<body>
<h1>POS 鍵盤對照卡（貼螢幕旁）</h1>
<table>
<tr><th>按鍵</th><th>功能</th></tr>
<tr><td>0–9、00</td><td>輸入金額</td></tr>
<tr><td>Enter</td><td>確認加入清單</td></tr>
<tr><td>Backspace</td><td>刪一字</td></tr>
<tr><td>↑ / ↓</td><td>選取明細列</td></tr>
<tr><td>M</td><td>修改選定列</td></tr>
<tr><td>Del</td><td>刪除選定列（二次確認）</td></tr>
<tr><td>F9</td><td>結帳列印發票</td></tr>
<tr><td>F5</td><td>開日報表</td></tr>
<tr><td>Esc</td><td>清空輸入 / 整單清除</td></tr>
</table>
<p><button onclick="window.print()">列印本卡</button></p>
</body>
</html>
